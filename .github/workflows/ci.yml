name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            backend/go.sum
            prototypes/go.sum

      - name: Vet, Test & Build Backend
        working-directory: ./backend
        run: |
          go vet ./...
          go test -v ./...
          go build -o morphlab-server .

      - name: Vet, Test & Build CLI (morphcli)
        working-directory: ./prototypes
        run: |
          go vet ./...
          go test -v ./...
          go build -o morphcli .
